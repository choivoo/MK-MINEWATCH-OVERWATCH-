plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
    splitEnvironmentSourceSets()
    mods {
        "minewatch" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:4.8.2"
    include "software.bernie.geckolib:geckolib-fabric-1.21.1:4.8.2"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
test {
    useJUnitPlatform()
    jvmArgs "-Dfile.encoding=UTF-8", "-Dsun.jnu.encoding=UTF-8"
}

// Fabric 게임테스트: 실제 서버를 띄워 맵/봇/매치 로직을 검증한다. (gradlew runGametest)
// 로컬 개발용 테스트 서버의 eula.txt 에 true 를 기록한다. 사용자가 명시적으로 허락함(2026-10-09).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "minewatch-gametest"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}
